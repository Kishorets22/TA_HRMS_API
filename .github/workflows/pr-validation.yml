name: PR Validation

on:
  pull_request:

permissions:
  contents: read

jobs:
  diff-check:
    name: Check PR diff formatting
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for whitespace errors
        env:
          BASE_REF: ${{ github.base_ref }}
        run: git diff --check "origin/${BASE_REF}...HEAD"
